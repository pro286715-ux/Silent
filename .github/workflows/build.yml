name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q SilentSchedule.zip
      - run: gradle assembleDebug --no-daemon
        working-directory: SilentSchedule
      - uses: actions/upload-artifact@v4
        with:
          name: SilentSchedule-apk
          path: SilentSchedule/app/build/outputs/apk/debug/app-debug.apk
